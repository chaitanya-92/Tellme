name: Build Tellme

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/offscreen.js
          node --check extension/popup.js

      - name: Build
        run: npm run build
